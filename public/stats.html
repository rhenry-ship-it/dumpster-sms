<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statistics</title>
<link rel="apple-touch-icon" href="logo.jpeg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Job Log" />
<meta name="theme-color" content="#0d2b45" />
<style>
  :root {
    --navy: #0d2b45;
    --navy-light: #163d5e;
    --teal: #2ba9cf;
    --teal-dark: #1c8bab;
    --gray: #9aa5ab;
    --ink: #14202b;
    --paper: #f4f7f9;
    --line: #d9e2e8;
    --ok: #2e9e5b;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 24px;
  }
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 20px 20px 24px;
    text-align: center;
    border-bottom: 4px solid var(--teal);
  }
  .header img {
    height: 64px;
    width: auto;
    display: block;
    margin: 0 auto 8px;
  }
  .header p.sub {
    color: #cfe4ee;
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .content { padding: 20px; }
  h1 { display: none; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdfe;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 50px; }
  .address-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1.5px solid var(--teal);
    border-top: none;
    border-radius: 0 0 7px 7px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .address-suggestions div {
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .address-suggestions div:last-child { border-bottom: none; }
  .address-suggestions div:active,
  .address-suggestions div:hover {
    background: #eaf6fa;
  }
  .trip-notice {
    background: #fff4e5;
    border: 1.5px solid #e0a83d;
    color: #7a5310;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .nav-tabs a {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 7px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid var(--navy);
    color: var(--navy);
    background: white;
  }
  .nav-tabs a.active {
    background: var(--navy);
    color: white;
  }
  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .total-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(13,43,69,0.06);
  }
  .total-card .value {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
  }
  .total-card .label {
    font-size: 12px;
    color: #667680;
    font-weight: 600;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-card.teal .value { color: var(--teal-dark); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-toggle button.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .submit-btn:active { background: var(--teal-dark); }
  .submit-btn:disabled { opacity: 0.6; }
  #status { margin-top: 10px; font-size: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(13,43,69,0.05);
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-weight: 700; color: var(--navy); }
  .job-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--navy);
    color: white;
  }
  .job-meta { font-size: 13px; color: #55636c; margin-top: 4px; line-height: 1.5; }
  .job-sent { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  .job.completed { opacity: 0.65; border-left-color: var(--gray); }
  .job-actions { display: flex; gap: 8px; margin-top: 10px; }
  .job-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
  }
  .job-actions button.complete-btn.done {
    background: var(--ok);
    border-color: var(--ok);
    color: white;
  }
  .job-actions button.delete-btn {
    border-color: var(--err);
    color: var(--err);
    flex: 0 0 auto;
    padding: 8px 14px;
  }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #667680;
    margin: 18px 0 8px;
  }
  #authOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-box {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .auth-box img { height: 56px; margin-bottom: 14px; }
  .auth-box p { font-weight: 700; color: var(--navy); margin: 0 0 12px; }
  .auth-box input {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #authError { color: var(--err); font-size: 13px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpeg" alt="Oak & Pallet Disposal Corporation" />
  <p class="sub">STATISTICS — dumpsters dropped off &amp; picked up</p>
</div>
<div class="content">

<div class="nav-tabs">
  <a href="index.html">New Job</a>
  <a href="driver.html">Driver</a>
  <a href="reports.html">All Jobs &amp; Totals</a>
  <a href="archive.html">Archive</a>
</div>
<div class="nav-tabs">
  <a href="stats.html" class="active">Statistics</a>
  <a href="assets.html">Asset Tracker</a>
</div>

<div class="section-label">This Week</div>
<div class="totals-grid" id="weekGrid"></div>

<div class="section-label">This Month</div>
<div class="totals-grid" id="monthGrid"></div>

<div class="section-label">This Quarter</div>
<div class="totals-grid" id="quarterGrid"></div>

<div class="section-label">This Year</div>
<div class="totals-grid" id="yearGrid"></div>

<script src="auth.js"></script>
<script>
function startOfWeek(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay());
  dt.setHours(0, 0, 0, 0);
  return dt;
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfQuarter(d) { const q = Math.floor(d.getMonth() / 3); return new Date(d.getFullYear(), q * 3, 1); }
function startOfYear(d) { return new Date(d.getFullYear(), 0, 1); }

function countInPeriod(jobs, periodStart) {
  const dropped = jobs.filter(j => j.type !== 'delivery' && j.dropoffCompleted && j.dropoffDate_computed && j.dropoffDate_computed >= periodStart).length;
  const picked = jobs.filter(j => j.type !== 'delivery' && j.completed && j.actualPickupDate && new Date(j.actualPickupDate) >= periodStart).length;
  return { dropped, picked };
}

function renderGrid(elId, stats) {
  document.getElementById(elId).innerHTML = `
    <div class="total-card"><div class="value">${stats.dropped}</div><div class="label">Dropped Off</div></div>
    <div class="total-card teal"><div class="value">${stats.picked}</div><div class="label">Picked Up</div></div>
  `;
}

async function loadStats() {
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    const now = new Date();

    // Drop-off events are dated by createdAt (the day the drop-off slip was logged),
    // since dropoffTime only stores a clock time, not a date.
    jobs.forEach(j => {
      j.dropoffDate_computed = j.dropoffCompleted && j.createdAt ? new Date(j.createdAt) : null;
    });

    renderGrid('weekGrid', countInPeriod(jobs, startOfWeek(now)));
    renderGrid('monthGrid', countInPeriod(jobs, startOfMonth(now)));
    renderGrid('quarterGrid', countInPeriod(jobs, startOfQuarter(now)));
    renderGrid('yearGrid', countInPeriod(jobs, startOfYear(now)));
  } catch (e) {
    document.getElementById('weekGrid').innerHTML = '<p style="color:#c62828">Could not load stats.</p>';
  }
}

requireAuth(loadStats);
</script>

</div>
</body>
</html>
