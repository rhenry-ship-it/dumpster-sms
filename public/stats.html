<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statistics</title>
<link rel="apple-touch-icon" href="logo.jpeg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Job Log" />
<meta name="theme-color" content="#0d2b45" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2b45;
    --navy-light: #163d5e;
    --teal: #2ba9cf;
    --teal-dark: #1c8bab;
    --gray: #9aa5ab;
    --ink: #14202b;
    --paper: #f4f7f9;
    --line: #d9e2e8;
    --ok: #2e9e5b;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 32px;
    -webkit-font-smoothing: antialiased;
  }
  #topActionBar {
    position: sticky;
    top: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--navy);
    padding: 0 10px;
    border-bottom: 3px solid var(--teal);
  }
  #navLinks {
    display: flex;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  #navLinks::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto;
    color: #cfe4ee;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 14px 12px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
  }
  .nav-link.active {
    color: white;
    border-bottom-color: var(--teal);
  }
  .top-action {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .top-action:active { background: rgba(255,255,255,0.3); }
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 24px 20px 28px;
    text-align: center;
    border-bottom: 4px solid var(--teal);
  }
  .header img {
    height: 68px;
    width: auto;
    display: block;
    margin: 0 auto 10px;
    border-radius: 12px;
  }
  .header p.sub {
    color: #cfe4ee;
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .content { padding: 20px; max-width: 640px; margin: 0 auto; }
  h1 { display: none; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdfe;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 50px; }
  .address-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1.5px solid var(--teal);
    border-top: none;
    border-radius: 0 0 7px 7px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .address-suggestions div {
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .address-suggestions div:last-child { border-bottom: none; }
  .address-suggestions div:active,
  .address-suggestions div:hover {
    background: #eaf6fa;
  }
  .trip-notice {
    background: #fff4e5;
    border: 1.5px solid #e0a83d;
    color: #7a5310;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: #e9eef1;
    padding: 4px;
    border-radius: 12px;
  }
  .nav-tabs a {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    border: none;
    color: var(--navy);
    background: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .nav-tabs a.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 2px 6px rgba(13,43,69,0.25);
  }
  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .total-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(13,43,69,0.07);
  }
  .total-card .value {
    font-size: 25px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.3px;
  }
  .total-card .label {
    font-size: 11.5px;
    color: #667680;
    font-weight: 600;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-card.teal .value { color: var(--teal-dark); }
  #searchBarWrap { margin-bottom: 16px; }
  #globalSearch {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    font-family: inherit;
    background: white;
  }
  #globalSearch:focus {
    outline: none;
    border-color: var(--teal);
  }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 11px;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .type-toggle button.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.2px;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(43,169,207,0.35);
    transition: transform 0.1s, background 0.15s;
  }
  .submit-btn:active { background: var(--teal-dark); transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; box-shadow: none; }
  #status { margin-top: 10px; font-size: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-weight: 700; color: var(--navy); }
  .job-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--navy);
    color: white;
  }
  .job-meta { font-size: 13px; color: #55636c; margin-top: 4px; line-height: 1.5; }
  .job-sent { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  .job.completed { opacity: 0.65; border-left-color: var(--gray); }
  .job-actions { display: flex; gap: 8px; margin-top: 10px; }
  .job-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
  }
  .job-actions button.complete-btn.done {
    background: var(--ok);
    border-color: var(--ok);
    color: white;
  }
  .job-actions button.delete-btn {
    border-color: var(--err);
    color: var(--err);
    flex: 0 0 auto;
    padding: 8px 14px;
  }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #667680;
    margin: 18px 0 8px;
  }
  #authOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-box {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .auth-box img { height: 56px; margin-bottom: 14px; }
  .auth-box p { font-weight: 700; color: var(--navy); margin: 0 0 12px; }
  .auth-box input {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #authError { color: var(--err); font-size: 13px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpeg" alt="Oak & Pallet Disposal Corporation" />
  <p class="sub">STATISTICS — dumpsters dropped off &amp; picked up</p>
</div>
<div class="content">

<div id="expensesSection" style="display:none;">
  <div class="section-label">Ballpark Monthly Operating Expenses</div>
  <form id="expensesForm">
    <div class="row">
      <div>
        <label>Fuel ($/mo)</label>
        <input type="number" step="0.01" name="fuelCost" placeholder="e.g. 2500" />
      </div>
      <div>
        <label>Payroll ($/mo)</label>
        <input type="number" step="0.01" name="payrollCost" placeholder="e.g. 12000" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Truck/Maintenance/Insurance ($/mo)</label>
        <input type="number" step="0.01" name="truckCost" placeholder="e.g. 1800" />
      </div>
      <div>
        <label>Yearly Rental Goal</label>
        <input type="number" step="1" name="yearlyGoal" placeholder="750" />
      </div>
    </div>
    <button type="submit" class="submit-btn">Save</button>
    <div id="expensesStatus" style="font-size:13px; font-weight:600; margin-top:6px;"></div>
  </form>
</div>

<div class="section-label">Year to Date</div>
<div class="totals-grid" id="yearGrid"></div>

<div id="historyImportSection" style="display:none;">
  <p style="font-size:13px; color:#667680;">
    Upload spreadsheets and manage imports from the <a href="data.html" style="color:var(--teal-dark); font-weight:700;">Data</a> page.
  </p>
</div>

<script src="auth.js"></script>
<script>
function startOfWeek(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay());
  dt.setHours(0, 0, 0, 0);
  return dt;
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfQuarter(d) { const q = Math.floor(d.getMonth() / 3); return new Date(d.getFullYear(), q * 3, 1); }
function startOfYear(d) { return new Date(d.getFullYear(), 0, 1); }

function yearToDateMultiplier(now) {
  const start = startOfYear(now);
  const end = new Date(now.getFullYear() + 1, 0, 1);
  const fraction = (now - start) / (end - start);
  return fraction * 12; // scales a monthly ballpark figure to however much of the year has elapsed
}

function countInPeriod(jobs, periodStart, periodMultiplier, expenses) {
  const dropped = jobs.filter(j => j.type !== 'delivery' && j.dropoffCompleted && j.dropoffDate_computed && j.dropoffDate_computed >= periodStart).length;
  const pickedJobs = jobs.filter(j => j.type !== 'delivery' && j.completed && j.actualPickupDate && new Date(j.actualPickupDate) >= periodStart);
  function parseMoney(val) {
    if (val === null || val === undefined || val === '') return 0;
    const n = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  const revenue = pickedJobs.reduce((s, j) => s + parseMoney(j.price), 0);
  const dumpCost = pickedJobs.reduce((s, j) => s + parseMoney(j.dumpCost), 0);
  const grossProfit = revenue - dumpCost;
  const dumpRatio = revenue > 0 ? (dumpCost / revenue) * 100 : 0;

  const periodExpenses = (parseMoney(expenses.fuelCost) + parseMoney(expenses.payrollCost) + parseMoney(expenses.truckCost)) * periodMultiplier;
  const netProfit = grossProfit - periodExpenses;

  return { dropped, picked: pickedJobs.length, revenue, dumpCost, grossProfit, dumpRatio, periodExpenses, netProfit };
}

function renderGrid(elId, stats, isAdmin) {
  const financialCards = isAdmin ? `
    <div class="total-card"><div class="value">$${stats.grossProfit.toFixed(2)}</div><div class="label">Gross Profit</div></div>
    <div class="total-card"><div class="value">${stats.dumpRatio.toFixed(1)}%</div><div class="label">Dump Cost % of Rev</div></div>
    <div class="total-card"><div class="value">$${stats.periodExpenses.toFixed(2)}</div><div class="label">YTD Ballpark Expenses</div></div>
    <div class="total-card teal"><div class="value">$${stats.netProfit.toFixed(2)}</div><div class="label">YTD Net Profit</div></div>
  ` : '';
  document.getElementById(elId).innerHTML = `
    <div class="total-card"><div class="value">${stats.dropped}</div><div class="label">Dropped Off</div></div>
    <div class="total-card teal"><div class="value">${stats.picked}</div><div class="label">Picked Up</div></div>
    ${financialCards}
  `;
}

async function loadStats(role = getRole()) {
  const isAdmin = role === 'admin';
  try {
    const [jobsRes, settingsRes] = await Promise.all([
      fetch('/api/jobs'),
      fetch('/api/settings'),
    ]);
    const jobs = await jobsRes.json();
    const expenses = await settingsRes.json();
    const now = new Date();

    // Drop-off events are dated by createdAt (the day the drop-off slip was logged),
    // since dropoffTime only stores a clock time, not a date.
    jobs.forEach(j => {
      j.dropoffDate_computed = j.dropoffCompleted && (j.dropoffActualDate || j.dropDate)
        ? new Date(j.dropoffActualDate || j.dropDate)
        : (j.dropoffCompleted && j.createdAt ? new Date(j.createdAt) : null);
    });

    // Expenses are scaled to how much of the year has actually elapsed, not a full 12 months.
    renderGrid('yearGrid', countInPeriod(jobs, startOfYear(now), yearToDateMultiplier(now), expenses), isAdmin);
  } catch (e) {
    document.getElementById('yearGrid').innerHTML = '<p style="color:#c62828">Could not load stats.</p>';
  }
}

async function setupExpensesForm() {
  const form = document.getElementById('expensesForm');
  const statusEl = document.getElementById('expensesStatus');

  try {
    const res = await fetch('/api/settings');
    const settings = await res.json();
    form.fuelCost.value = settings.fuelCost || '';
    form.payrollCost.value = settings.payrollCost || '';
    form.truckCost.value = settings.truckCost || '';
    form.yearlyGoal.value = settings.yearlyGoal || 750;
  } catch (e) {}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      statusEl.style.color = 'var(--ok)';
      statusEl.textContent = '✅ Saved.';
      loadStats();
    } catch (err) {
      statusEl.style.color = 'var(--err)';
      statusEl.textContent = 'Could not save.';
    }
    btn.disabled = false;
    btn.textContent = 'Save';
  });
}

requireAuth(function (role) {
  if (role === 'admin') {
    document.getElementById('historyImportSection').style.display = 'block';
    document.getElementById('expensesSection').style.display = 'block';
    setupExpensesForm();
  }
  loadStats(role);
});
</script>

</div>
</body>
</html>
