<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dumpster Job Log</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #faf9f6;
    --accent: #c65d2e;
    --line: #e0ddd5;
    --ok: #2e7d32;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.sub { color: #777; margin: 0 0 20px; font-size: 14px; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 24px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 7px;
    font-size: 14px;
    cursor: pointer;
  }
  .type-toggle button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-btn:disabled { opacity: 0.6; }
  #status { margin-top: 10px; font-size: 14px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-weight: 700; }
  .job-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #f0ece4;
    color: #555;
  }
  .job-meta { font-size: 13px; color: #555; margin-top: 4px; line-height: 1.5; }
  .job-sent { font-size: 12px; margin-top: 6px; }
  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  h2 { font-size: 16px; margin: 0 0 10px; }
</style>
</head>
<body>

<h1>Dumpster Job Log</h1>
<p class="sub">Log a rental or delivery — texts the crew automatically.</p>

<form id="jobForm">
  <div class="type-toggle">
    <button type="button" data-type="rental" class="active">🗑️ Rental</button>
    <button type="button" data-type="delivery">📦 Material Delivery</button>
  </div>

  <div class="row">
    <div>
      <label>Customer</label>
      <input name="customer" required placeholder="Name" />
    </div>
    <div>
      <label>Address</label>
      <input name="address" required placeholder="Job site address" />
    </div>
  </div>

  <div class="row">
    <div>
      <label id="sizeLabel">Dumpster Size</label>
      <input name="size" placeholder="e.g. 20 yd" />
    </div>
    <div>
      <label>Price</label>
      <input name="price" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div class="row">
    <div>
      <label id="dropLabel">Drop-off Date</label>
      <input name="dropDate" type="date" />
    </div>
    <div id="pickupWrap">
      <label>Pickup Date</label>
      <input name="pickupDate" type="date" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Notes</label>
      <textarea name="notes" placeholder="Gate code, driveway access, permit #, etc."></textarea>
    </div>
  </div>

  <button type="submit" class="submit-btn">Log Job &amp; Text Crew</button>
  <div id="status"></div>
</form>

<h2>Recent Jobs</h2>
<div id="jobList">Loading…</div>

<script>
let currentType = 'rental';

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    const isDelivery = currentType === 'delivery';
    document.getElementById('sizeLabel').textContent = isDelivery ? 'Material / Load' : 'Dumpster Size';
    document.getElementById('dropLabel').textContent = isDelivery ? 'Delivery Date' : 'Drop-off Date';
    document.getElementById('pickupWrap').style.display = isDelivery ? 'none' : 'block';
  });
});

const form = document.getElementById('jobForm');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';
  statusEl.className = '';
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  body.type = currentType;

  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save job');

    if (data.textResult && data.textResult.sent) {
      statusEl.textContent = '✅ Logged and texted the crew.';
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = '⚠️ Job logged, but text may not have sent: ' +
        (data.textResult?.reason || (data.textResult?.failures?.map(f => f.to).join(', ') + ' failed'));
      statusEl.className = 'err';
    }
    form.reset();
    document.querySelector('.type-toggle button[data-type="rental"]').click();
    loadJobs();
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    statusEl.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log Job & Text Crew';
  }
});

async function loadJobs() {
  const listEl = document.getElementById('jobList');
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    if (jobs.length === 0) {
      listEl.innerHTML = '<p style="color:#999">No jobs logged yet.</p>';
      return;
    }
    listEl.innerHTML = jobs.slice(0, 25).map(j => `
      <div class="job">
        <div class="job-top">
          <div class="job-title">${escapeHtml(j.customer)}</div>
          <div class="job-badge">${j.type === 'delivery' ? 'Delivery' : 'Rental'}</div>
        </div>
        <div class="job-meta">
          ${escapeHtml(j.address)}<br/>
          ${j.size ? escapeHtml(j.size) + ' · ' : ''}${j.dropDate || ''}${j.pickupDate ? ' → ' + j.pickupDate : ''}${j.price ? ' · $' + j.price : ''}
        </div>
        <div class="job-sent ${j.textResult?.sent ? 'ok' : 'err'}">
          ${j.textResult?.sent ? '✓ Texted crew' : '✗ Text not sent'}
        </div>
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = '<p style="color:#c62828">Could not load jobs.</p>';
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadJobs();
</script>

</body>
</html>
