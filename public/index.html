<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dumpster Job Log</title>
<link rel="apple-touch-icon" href="logo.jpeg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Job Log" />
<meta name="theme-color" content="#0d2b45" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2b45;
    --navy-light: #163d5e;
    --teal: #2ba9cf;
    --teal-dark: #1c8bab;
    --gray: #9aa5ab;
    --ink: #14202b;
    --paper: #f4f7f9;
    --line: #d9e2e8;
    --ok: #2e9e5b;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 32px;
    -webkit-font-smoothing: antialiased;
  }
  #topActionBar {
    position: sticky;
    top: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--navy);
    padding: 0 10px;
    border-bottom: 3px solid var(--teal);
  }
  #navLinks {
    display: flex;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  #navLinks::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto;
    color: #cfe4ee;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 14px 12px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
  }
  .nav-link.active {
    color: white;
    border-bottom-color: var(--teal);
  }
  .top-action {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .top-action:active { background: rgba(255,255,255,0.3); }
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 24px 20px 28px;
    text-align: center;
    border-bottom: 4px solid var(--teal);
  }
  .header img {
    height: 68px;
    width: auto;
    display: block;
    margin: 0 auto 10px;
    border-radius: 12px;
  }
  .header p.sub {
    color: #cfe4ee;
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .content { padding: 20px; max-width: 640px; margin: 0 auto; }
  h1 { display: none; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdfe;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 50px; }
  .address-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1.5px solid var(--teal);
    border-top: none;
    border-radius: 0 0 7px 7px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .address-suggestions div {
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .address-suggestions div:last-child { border-bottom: none; }
  .address-suggestions div:active,
  .address-suggestions div:hover {
    background: #eaf6fa;
  }
  .trip-notice {
    background: #fff4e5;
    border: 1.5px solid #e0a83d;
    color: #7a5310;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: #e9eef1;
    padding: 4px;
    border-radius: 12px;
  }
  .nav-tabs a {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    border: none;
    color: var(--navy);
    background: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .nav-tabs a.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 2px 6px rgba(13,43,69,0.25);
  }
  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .total-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(13,43,69,0.07);
  }
  .total-card .value {
    font-size: 25px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.3px;
  }
  .total-card .label {
    font-size: 11.5px;
    color: #667680;
    font-weight: 600;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-card.teal .value { color: var(--teal-dark); }
  #searchBarWrap { margin-bottom: 16px; }
  #globalSearch {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    font-family: inherit;
    background: white;
  }
  #globalSearch:focus {
    outline: none;
    border-color: var(--teal);
  }
  .quick-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .quick-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 8px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 12px rgba(13,43,69,0.08);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .quick-card:active { transform: scale(0.96); box-shadow: 0 1px 6px rgba(13,43,69,0.1); }
  .quick-card.active-card {
    border-color: var(--teal);
    border-width: 2px;
    background: #f4fafc;
  }
  .qc-icon { width: 52px; height: 52px; }
  .qc-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy);
    text-align: center;
    line-height: 1.3;
  }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 11px;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .type-toggle button.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.2px;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(43,169,207,0.35);
    transition: transform 0.1s, background 0.15s;
  }
  .submit-btn:active { background: var(--teal-dark); transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; box-shadow: none; }
  #status { margin-top: 10px; font-size: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-weight: 700; color: var(--navy); }
  .job-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--navy);
    color: white;
  }
  .job-meta { font-size: 13px; color: #55636c; margin-top: 4px; line-height: 1.5; }
  .job-sent { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  .job.completed { opacity: 0.65; border-left-color: var(--gray); }
  .job-actions { display: flex; gap: 8px; margin-top: 10px; }
  .job-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
  }
  .job-actions button.complete-btn.done {
    background: var(--ok);
    border-color: var(--ok);
    color: white;
  }
  .job-actions button.delete-btn {
    border-color: var(--err);
    color: var(--err);
    flex: 0 0 auto;
    padding: 8px 14px;
  }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #667680;
    margin: 18px 0 8px;
  }
  #authOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-box {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .auth-box img { height: 56px; margin-bottom: 14px; }
  .auth-box p { font-weight: 700; color: var(--navy); margin: 0 0 12px; }
  .auth-box input {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #authError { color: var(--err); font-size: 13px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpeg" alt="Oak & Pallet Disposal Corporation" />
  <p class="sub">JOB LOG — logs a rental or delivery and texts the crew</p>
</div>
<div class="content">

<div class="quick-actions">
  <button type="button" class="quick-card" id="qcRental">
    <svg viewBox="0 0 100 100" class="qc-icon"><rect x="18" y="38" width="64" height="42" rx="4" fill="var(--navy)"/><path d="M14 38 L86 38 L76 24 L24 24 Z" fill="var(--teal)"/><rect x="24" y="48" width="52" height="6" fill="rgba(255,255,255,0.35)"/><rect x="24" y="60" width="52" height="6" fill="rgba(255,255,255,0.2)"/></svg>
    <div class="qc-label">New Dumpster<br/>Rental</div>
  </button>
  <button type="button" class="quick-card" id="qcDelivery">
    <svg viewBox="0 0 100 100" class="qc-icon"><path d="M20 78 Q50 30 80 78 Z" fill="var(--teal)"/><path d="M35 78 Q50 48 65 78 Z" fill="var(--navy)"/><circle cx="28" cy="72" r="4" fill="rgba(255,255,255,0.4)"/><circle cx="55" cy="66" r="3" fill="rgba(255,255,255,0.4)"/><circle cx="70" cy="73" r="3.5" fill="rgba(255,255,255,0.4)"/></svg>
    <div class="qc-label">New Material<br/>Delivery</div>
  </button>
  <button type="button" class="quick-card" id="qcPickup">
    <svg viewBox="0 0 100 100" class="qc-icon"><rect x="10" y="46" width="46" height="28" rx="3" fill="var(--navy)"/><path d="M56 52 L78 52 L88 66 L88 74 L56 74 Z" fill="var(--teal)"/><circle cx="30" cy="78" r="8" fill="var(--ink)"/><circle cx="74" cy="78" r="8" fill="var(--ink)"/><circle cx="30" cy="78" r="3" fill="#cfe4ee"/><circle cx="74" cy="78" r="3" fill="#cfe4ee"/></svg>
    <div class="qc-label">Schedule<br/>Pickup</div>
  </button>
</div>

<form id="jobForm" style="display:none;">
  <div class="type-toggle">
    <button type="button" data-type="rental" class="active">🗑️ Rental</button>
    <button type="button" data-type="delivery">📦 Material Delivery</button>
  </div>

  <div class="row">
    <div>
      <label>Customer</label>
      <input name="customer" required placeholder="Name" />
    </div>
    <div style="position: relative;">
      <label>Address</label>
      <input name="address" id="addressInput" required placeholder="Start typing an address…" autocomplete="off" />
      <div id="addressSuggestions" class="address-suggestions"></div>
    </div>
  </div>

  <div class="row" id="rentalRow">
    <div>
      <label>Dumpster Size</label>
      <select name="size" id="sizeSelect">
        <option value="10 YD">10 YD</option>
        <option value="15 YD">15 YD</option>
      </select>
    </div>
    <div>
      <label>Price</label>
      <input name="price" id="priceInputRental" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div class="row" id="deliveryRow" style="display:none;">
    <div>
      <label>Material</label>
      <select name="material" id="materialSelect">
        <option value="Gravel">Gravel</option>
        <option value="Loam">Loam</option>
        <option value="Millings">Millings</option>
        <option value="Mulch">Mulch</option>
      </select>
    </div>
    <div>
      <label>Yards</label>
      <select name="yards" id="yardsSelect">
        <option value="1">1 YD</option>
        <option value="2">2 YD</option>
        <option value="3">3 YD</option>
        <option value="4">4 YD</option>
        <option value="5">5 YD</option>
        <option value="6">6 YD</option>
        <option value="7">7 YD</option>
        <option value="8">8 YD</option>
        <option value="9">9 YD</option>
        <option value="10">10 YD</option>
      </select>
    </div>
  </div>

  <div class="row" id="deliveryPriceRow" style="display:none;">
    <div>
      <label>Price</label>
      <input name="priceDelivery" id="priceInputDelivery" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div id="tripNotice" class="trip-notice" style="display:none;"></div>

  <div class="row">
    <div>
      <label id="dropLabel">Drop-off Date</label>
      <input name="dropDate" type="date" />
    </div>
    <div id="pickupWrap">
      <label>Pickup Date</label>
      <input name="pickupDate" type="date" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Notes</label>
      <textarea name="notes" placeholder="Gate code, driveway access, permit #, etc."></textarea>
    </div>
  </div>

  <button type="submit" class="submit-btn">Log Job &amp; Text Crew</button>
  <div id="status"></div>
</form>

<div id="pickupPanel" style="display:none;">
  <h2>Schedule a Pickup</h2>
  <p style="font-size:13px; color:#667680; margin-top:-8px;">Pick a dumpster currently on site and set its pickup date.</p>
  <div id="pickupSelectList">Loading…</div>
</div>

<h2>Recent Jobs</h2>
<div id="jobList">Loading…</div>

<script src="auth.js"></script>
<script>
let currentType = 'rental';

function showForm(type) {
  document.getElementById('jobForm').style.display = 'block';
  document.getElementById('pickupPanel').style.display = 'none';
  document.querySelector(`.type-toggle button[data-type="${type}"]`).click();
  document.getElementById('jobForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('qcRental').addEventListener('click', () => {
  setActiveCard('qcRental');
  showForm('rental');
});
document.getElementById('qcDelivery').addEventListener('click', () => {
  setActiveCard('qcDelivery');
  showForm('delivery');
});
document.getElementById('qcPickup').addEventListener('click', () => {
  setActiveCard('qcPickup');
  document.getElementById('jobForm').style.display = 'none';
  const panel = document.getElementById('pickupPanel');
  panel.style.display = 'block';
  loadPickupCandidates();
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function setActiveCard(id) {
  document.querySelectorAll('.quick-card').forEach(c => c.classList.remove('active-card'));
  document.getElementById(id).classList.add('active-card');
}

async function loadPickupCandidates() {
  const listEl = document.getElementById('pickupSelectList');
  listEl.innerHTML = 'Loading…';
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    const onSite = jobs.filter(j => j.type !== 'delivery' && j.dropoffCompleted && !j.completed);

    if (onSite.length === 0) {
      listEl.innerHTML = '<p style="color:#999">No dumpsters currently on site.</p>';
      return;
    }

    listEl.innerHTML = onSite.map(j => `
      <div class="job">
        <div class="job-top">
          <div class="job-title">${escapeHtml(j.customer)}</div>
          <div class="job-badge">${j.dumpsterId ? '#' + escapeHtml(j.dumpsterId) : escapeHtml(j.size || 'Rental')}</div>
        </div>
        <div class="job-meta">${escapeHtml(j.address)}${j.pickupDate ? ' · Scheduled: ' + j.pickupDate : ' · No pickup date yet'}</div>
        <form class="schedule-form" data-id="${j.id}" style="margin-top:10px; display:flex; gap:8px; align-items:flex-end;">
          <div style="flex:1;">
            <label>Pickup Date</label>
            <input type="date" name="pickupDate" value="${j.pickupDate || ''}" required />
          </div>
          <button type="submit" class="submit-btn" style="width:auto; padding:11px 16px; margin-top:0;">Save</button>
        </form>
      </div>
    `).join('');

    document.querySelectorAll('.schedule-form').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = form.dataset.id;
        const fd = new FormData(form);
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Saving…';
        try {
          await fetch(`/api/jobs/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pickupDate: fd.get('pickupDate') })
          });
          btn.textContent = '✓ Saved';
        } catch (err) {
          alert('Could not save pickup date.');
          btn.disabled = false;
          btn.textContent = 'Save';
        }
      });
    });
  } catch (e) {
    listEl.innerHTML = '<p style="color:#c62828">Could not load dumpsters.</p>';
  }
}

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    const isDelivery = currentType === 'delivery';
    document.getElementById('rentalRow').style.display = isDelivery ? 'none' : 'flex';
    document.getElementById('deliveryRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('deliveryPriceRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('dropLabel').textContent = isDelivery ? 'Delivery Date' : 'Drop-off Date';
    document.getElementById('pickupWrap').style.display = isDelivery ? 'none' : 'block';
    updateTripNotice();
  });
});

const yardsSelect = document.getElementById('yardsSelect');
const tripNotice = document.getElementById('tripNotice');

function updateTripNotice() {
  if (currentType !== 'delivery') {
    tripNotice.style.display = 'none';
    return;
  }
  const yards = parseInt(yardsSelect.value, 10);
  if (yards > 5) {
    const trips = Math.ceil(yards / 5);
    tripNotice.textContent = `Truck holds 5 YD max — this will be logged and texted as ${trips} separate trips.`;
    tripNotice.style.display = 'block';
  } else {
    tripNotice.style.display = 'none';
  }
}
yardsSelect.addEventListener('change', updateTripNotice);

const form = document.getElementById('jobForm');
const statusEl = document.getElementById('status');

// ---- address autocomplete (OpenStreetMap Nominatim, no API key needed) ----
const addressInput = document.getElementById('addressInput');
const suggestBox = document.getElementById('addressSuggestions');
let addressDebounce;

addressInput.addEventListener('input', () => {
  clearTimeout(addressDebounce);
  const q = addressInput.value.trim();
  if (q.length < 4) {
    suggestBox.style.display = 'none';
    suggestBox.innerHTML = '';
    return;
  }
  addressDebounce = setTimeout(() => searchAddress(q), 400);
});

async function searchAddress(q) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const results = await res.json();
    if (!results.length) {
      suggestBox.style.display = 'none';
      suggestBox.innerHTML = '';
      return;
    }
    suggestBox.innerHTML = results.map(r =>
      `<div data-address="${escapeHtml(r.display_name)}">${escapeHtml(r.display_name)}</div>`
    ).join('');
    suggestBox.style.display = 'block';
  } catch (e) {
    suggestBox.style.display = 'none';
  }
}

suggestBox.addEventListener('click', (e) => {
  const target = e.target.closest('div[data-address]');
  if (!target) return;
  addressInput.value = target.dataset.address;
  suggestBox.style.display = 'none';
  suggestBox.innerHTML = '';
});

document.addEventListener('click', (e) => {
  if (e.target !== addressInput && !suggestBox.contains(e.target)) {
    suggestBox.style.display = 'none';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';
  statusEl.className = '';
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  body.type = currentType;
  body.price = currentType === 'delivery' ? body.priceDelivery : body.price;

  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save job');

    const trips = data.trips || [];
    const allSent = trips.length > 0 && trips.every(t => t.textResult && t.textResult.sent);
    if (allSent) {
      statusEl.textContent = trips.length > 1
        ? `✅ Logged and texted the crew — ${trips.length} trips.`
        : '✅ Logged and notified the crew.';
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = '⚠️ Job logged, but nothing sent — check Twilio/email setup.';
      statusEl.className = 'err';
    }
    form.reset();
    document.querySelector('.type-toggle button[data-type="rental"]').click();
    loadJobs();
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    statusEl.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log Job & Text Crew';
  }
});

async function loadJobs(role = getRole()) {
  const isDriver = role === 'driver';
  const listEl = document.getElementById('jobList');
  try {
    const res = await fetch('/api/jobs');
    const allJobs = await res.json();
    const jobs = allJobs.filter(j => j.notes !== 'Imported from spreadsheet');
    if (jobs.length === 0) {
      listEl.innerHTML = '<p style="color:#999">No jobs logged yet.</p>';
      return;
    }
    listEl.innerHTML = jobs.slice(0, 25).map(j => `
      <div class="job ${j.completed ? 'completed' : ''}">
        <div class="job-top">
          <div class="job-title">${escapeHtml(j.customer)}</div>
          <div class="job-badge">${j.type === 'delivery' ? 'Delivery' : 'Rental'}${j.tripLabel ? ' · ' + escapeHtml(j.tripLabel) : ''}</div>
        </div>
        <div class="job-meta">
          ${escapeHtml(j.address)}<br/>
          ${j.type === 'delivery'
            ? `${j.material ? escapeHtml(j.material) + ' · ' : ''}${j.yards ? j.yards + ' YD · ' : ''}`
            : `${j.size ? escapeHtml(j.size) + ' · ' : ''}`
          }${j.dropDate || ''}${j.pickupDate ? ' → ' + j.pickupDate : ''}${(!isDriver && j.price) ? ' · $' + j.price : ''}
        </div>
        <div class="job-sent ${j.textResult?.sent ? 'ok' : 'err'}">
          ${j.textResult?.sent ? '✓ Texted crew' : '✗ Text not sent'}
        </div>
        <div class="job-actions">
          <button class="complete-btn ${j.completed ? 'done' : ''}" data-id="${j.id}" data-completed="${!!j.completed}">
            ${j.completed ? '✓ Completed' : 'Mark Complete'}
          </button>
          ${isDriver ? '' : `<button class="delete-btn" data-id="${j.id}">Delete</button>`}
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.complete-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleComplete(btn.dataset.id, btn.dataset.completed !== 'true'));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteJob(btn.dataset.id));
    });
  } catch (e) {
    listEl.innerHTML = '<p style="color:#c62828">Could not load jobs.</p>';
  }
}

async function toggleComplete(id, completed) {
  try {
    await fetch(`/api/jobs/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed })
    });
    loadJobs();
  } catch (e) {
    alert('Could not update job.');
  }
}

async function deleteJob(id) {
  if (!confirm('Delete this job? This cannot be undone.')) return;
  try {
    await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
    loadJobs();
  } catch (e) {
    alert('Could not delete job.');
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

requireAuth(loadJobs);
</script>

</div>
</body>
</html>
