<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive</title>
<link rel="apple-touch-icon" href="logo.jpeg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Job Log" />
<meta name="theme-color" content="#0d2b45" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2b45;
    --navy-light: #163d5e;
    --teal: #2ba9cf;
    --teal-dark: #1c8bab;
    --gray: #9aa5ab;
    --ink: #14202b;
    --paper: #f4f7f9;
    --line: #d9e2e8;
    --ok: #2e9e5b;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 32px;
    -webkit-font-smoothing: antialiased;
  }
  #topActionBar {
    position: sticky;
    top: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--navy);
    padding: 0 10px;
    border-bottom: 3px solid var(--teal);
  }
  #navLinks {
    display: flex;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }
  #navLinks::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto;
    color: #cfe4ee;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 14px 12px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
  }
  .nav-link.active {
    color: white;
    border-bottom-color: var(--teal);
  }
  .top-action {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .top-action:active { background: rgba(255,255,255,0.3); }
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 24px 20px 28px;
    text-align: center;
    border-bottom: 4px solid var(--teal);
  }
  .header img {
    height: 68px;
    width: auto;
    display: block;
    margin: 0 auto 10px;
    border-radius: 12px;
  }
  .header p.sub {
    color: #cfe4ee;
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .content { padding: 20px; max-width: 640px; margin: 0 auto; }
  h1 { display: none; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdfe;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 50px; }
  .address-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1.5px solid var(--teal);
    border-top: none;
    border-radius: 0 0 7px 7px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .address-suggestions div {
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .address-suggestions div:last-child { border-bottom: none; }
  .address-suggestions div:active,
  .address-suggestions div:hover {
    background: #eaf6fa;
  }
  .trip-notice {
    background: #fff4e5;
    border: 1.5px solid #e0a83d;
    color: #7a5310;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: #e9eef1;
    padding: 4px;
    border-radius: 12px;
  }
  .nav-tabs a {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    border: none;
    color: var(--navy);
    background: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .nav-tabs a.active {
    background: var(--navy);
    color: white;
    box-shadow: 0 2px 6px rgba(13,43,69,0.25);
  }
  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .total-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(13,43,69,0.07);
  }
  .total-card .value {
    font-size: 25px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.3px;
  }
  .total-card .label {
    font-size: 11.5px;
    color: #667680;
    font-weight: 600;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-card.teal .value { color: var(--teal-dark); }
  #searchBarWrap { margin-bottom: 16px; }
  #globalSearch {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    font-family: inherit;
    background: white;
  }
  #globalSearch:focus {
    outline: none;
    border-color: var(--teal);
  }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 11px;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .type-toggle button.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.2px;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(43,169,207,0.35);
    transition: transform 0.1s, background 0.15s;
  }
  .submit-btn:active { background: var(--teal-dark); transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; box-shadow: none; }
  #status { margin-top: 10px; font-size: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-weight: 700; color: var(--navy); }
  .job-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--navy);
    color: white;
  }
  .job-meta { font-size: 13px; color: #55636c; margin-top: 4px; line-height: 1.5; }
  .job-sent { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  .job.completed { opacity: 0.65; border-left-color: var(--gray); }
  .job-actions { display: flex; gap: 8px; margin-top: 10px; }
  .job-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
  }
  .job-actions button.complete-btn.done {
    background: var(--ok);
    border-color: var(--ok);
    color: white;
  }
  .job-actions button.delete-btn {
    border-color: var(--err);
    color: var(--err);
    flex: 0 0 auto;
    padding: 8px 14px;
  }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #667680;
    margin: 18px 0 8px;
  }
  #authOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-box {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .auth-box img { height: 56px; margin-bottom: 14px; }
  .auth-box p { font-weight: 700; color: var(--navy); margin: 0 0 12px; }
  .auth-box input {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #authError { color: var(--err); font-size: 13px; font-weight: 600; margin-top: 10px; }
  .archive-item { margin-bottom: 12px; }
  .archive-item .job { margin-bottom: 0; }
  .archive-row { cursor: pointer; }
  .archive-row.open { border-radius: 14px 14px 0 0; background: #f4fafc; }
  .archive-edit-wrap {
    background: #f4fafc;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 14px 14px;
    padding: 14px 16px;
  }
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpeg" alt="Oak & Pallet Disposal Corporation" />
  <p class="sub">ARCHIVE — completed more than 24 hours ago</p>
</div>
<div class="content">

<h2>Archived Jobs</h2>
<div id="archiveList">Loading…</div>

<script src="auth.js"></script>
<script>
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const DAY_MS = 24 * 60 * 60 * 1000;

async function loadArchive(role = getRole()) {
  const isDriver = role === 'driver';
  const isAdmin = role === 'admin';
  const listEl = document.getElementById('archiveList');
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    const now = Date.now();
    const archived = jobs.filter(j => j.completed && j.completedAt && (now - new Date(j.completedAt).getTime()) > DAY_MS);

    if (archived.length === 0) {
      listEl.innerHTML = '<p style="color:#999">Nothing archived yet.</p>';
      return;
    }

    listEl.innerHTML = archived.map(j => renderArchiveRow(j, isDriver, isAdmin)).join('');

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this job? This cannot be undone.')) return;
        try {
          await fetch(`/api/jobs/${btn.dataset.id}`, { method: 'DELETE' });
          loadArchive();
        } catch (e) {
          alert('Could not delete job.');
        }
      });
    });

    if (isAdmin) {
      document.querySelectorAll('.archive-row[data-target]').forEach(rowEl => {
        rowEl.addEventListener('click', () => {
          const wrap = document.getElementById(rowEl.dataset.target);
          if (!wrap) return;
          const isOpen = wrap.style.display === 'block';
          wrap.style.display = isOpen ? 'none' : 'block';
          rowEl.classList.toggle('open', !isOpen);
        });
      });

      document.querySelectorAll('.archive-edit-form').forEach(form => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = form.dataset.id;
          const fd = new FormData(form);
          const body = Object.fromEntries(fd.entries());
          const btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          btn.textContent = 'Saving…';
          try {
            await fetch(`/api/jobs/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            loadArchive();
          } catch (err) {
            alert('Could not save changes.');
            btn.disabled = false;
            btn.textContent = 'Save Changes';
          }
        });
      });
    }
  } catch (e) {
    listEl.innerHTML = '<p style="color:#c62828">Could not load jobs.</p>';
  }
}

function renderArchiveRow(j, isDriver, isAdmin) {
  const rowInner = `
    <div class="job-top">
      <div class="job-title">${escapeHtml(j.customer)}</div>
      <div class="job-badge">${j.type === 'delivery' ? 'Delivery' : 'Rental'}${j.tripLabel ? ' · ' + escapeHtml(j.tripLabel) : ''}</div>
    </div>
    <div class="job-meta">
      ${escapeHtml(j.address)}<br/>
      ${j.type === 'delivery'
        ? `${j.material ? escapeHtml(j.material) + ' · ' : ''}${j.yards ? j.yards + ' YD · ' : ''}`
        : `${j.size ? escapeHtml(j.size) + ' · ' : ''}${j.dumpsterId ? '#' + escapeHtml(j.dumpsterId) + ' · ' : ''}`
      }${j.dropDate || ''}${(!isDriver && j.price) ? ' · $' + j.price : ''}${(!isDriver && j.pickupWeight) ? ' · ' + j.pickupWeight + ' tons' : ''}${(!isDriver && j.dumpCost) ? ' · $' + j.dumpCost + ' dump fee' : ''}
    </div>
  `;

  if (!isAdmin) {
    return `
      <div class="job completed">
        ${rowInner}
        <div class="job-actions">
          ${isDriver ? '' : `<button class="delete-btn" data-id="${j.id}">Delete</button>`}
        </div>
      </div>
    `;
  }

  return `
    <div class="archive-item">
      <div class="job completed archive-row" data-target="archive-edit-${j.id}">
        ${rowInner}
        <div class="job-actions">
          <button class="delete-btn" data-id="${j.id}">Delete</button>
        </div>
      </div>
      <div class="archive-edit-wrap" id="archive-edit-${j.id}" style="display:none;">
        <form class="archive-edit-form" data-id="${j.id}">
          <div class="row">
            <div>
              <label>Customer</label>
              <input name="customer" value="${escapeHtml(j.customer)}" />
            </div>
            <div>
              <label>Address</label>
              <input name="address" value="${escapeHtml(j.address)}" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>${j.type === 'delivery' ? 'Material' : 'Size'}</label>
              <input name="${j.type === 'delivery' ? 'material' : 'size'}" value="${escapeHtml(j.type === 'delivery' ? (j.material || '') : (j.size || ''))}" />
            </div>
            <div>
              <label>Dumpster ID</label>
              <input name="dumpsterId" value="${escapeHtml(j.dumpsterId || '')}" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Price ($)</label>
              <input type="number" step="0.01" name="price" value="${escapeHtml(j.price || '')}" />
            </div>
            <div>
              <label>Pickup Weight (tons)</label>
              <input type="number" step="0.01" name="pickupWeight" value="${escapeHtml(j.pickupWeight || '')}" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Dump Cost ($)</label>
              <input type="number" step="0.01" name="dumpCost" value="${escapeHtml(j.dumpCost || '')}" />
            </div>
            <div>
              <label>Actual Pickup Date</label>
              <input type="date" name="actualPickupDate" value="${j.actualPickupDate || ''}" />
            </div>
          </div>
          <button type="submit" class="submit-btn">Save Changes</button>
        </form>
      </div>
    </div>
  `;
}

requireAuth(loadArchive);
</script>

</div>
</body>
</html>
