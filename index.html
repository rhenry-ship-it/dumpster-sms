<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
  :root {

    --teal-dark: #1c8bab;
    --gray: #9aa5ab;
    --ink: #14202b;
    --paper: #f4f7f9;
    --line: #d9e2e8;
    --ok: #2e9e5b;
    --err: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 24px;
  }
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 20px 20px 24px;
    text-align: center;
    border-bottom: 4px solid var(--teal);
  }
  .header img {
    height: 64px;
    width: auto;
    display: block;
    margin: 0 auto 8px;
  }
  .header p.sub {
    color: #cfe4ee;
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .content { padding: 20px; }
  h1 { display: none; }
  form {
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 10px rgba(13,43,69,0.06);
  }
  .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdfe;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 50px; }
  .address-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1.5px solid var(--teal);
    border-top: none;
    border-radius: 0 0 7px 7px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .address-suggestions div {
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .address-suggestions div:last-child { border-bottom: none; }
  .address-suggestions div:active,
  .address-suggestions div:hover {
    background: #eaf6fa;
  }
  .trip-notice {
    background: #fff4e5;
    border: 1.5px solid #e0a83d;
    color: #7a5310;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .nav-tabs a {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 7px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid var(--navy);
    color: var(--navy);
    background: white;
  }
  .nav-tabs a.active {
    background: var(--navy);
    color: white;
  }
  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .total-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(13,43,69,0.06);
  }
  .total-card .value {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
  }
  .total-card .label {
    font-size: 12px;
    color: #667680;
    font-weight: 600;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-card.teal .value { color: var(--teal-dark); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border: 1.5px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;

    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }
  .submit-btn {

    padding: 13px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .submit-btn:active { background: var(--teal-dark); }
  .submit-btn:disabled { opacity: 0.6; }
  #status { margin-top: 10px; font-size: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .job {
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(13,43,69,0.05);

  .job-title { font-weight: 700; color: var(--navy); }
  .job-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--navy);
    color: white;
  }

  .job-sent.ok { color: var(--ok); }
  .job-sent.err { color: var(--err); }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }

<div class="header">
  <img src="logo.jpg" alt="Oak & Pallet Disposal Corporation" />
  <p class="sub">JOB LOG — logs a rental or delivery and texts the crew</p>
</div>
<div class="content">

<div class="nav-tabs">
  <a href="index.html" class="active">New Job</a>
  <a href="reports.html">All Jobs &amp; Totals</a>
</div>

<form id="jobForm">
  <div class="type-toggle">
    <button type="button" data-type="rental" class="active">🗑️ Rental</button>
    <button type="button" data-type="delivery">📦 Material Delivery</button>
  </div>

  <div class="row">
    <div>
      <label>Customer</label>
      <input name="customer" required placeholder="Name" />
    </div>
    <div style="position: relative;">
      <label>Address</label>
      <input name="address" id="addressInput" required placeholder="Start typing an address…" autocomplete="off" />
      <div id="addressSuggestions" class="address-suggestions"></div>
    </div>
  </div>

  <div class="row" id="rentalRow">
    <div>
      <label>Dumpster Size</label>
      <select name="size" id="sizeSelect">
        <option value="10 YD">10 YD</option>
        <option value="15 YD">15 YD</option>
      </select>
    </div>
    <div>
      <label>Price</label>
      <input name="price" id="priceInputRental" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div class="row" id="deliveryRow" style="display:none;">
    <div>
      <label>Material</label>
      <select name="material" id="materialSelect">
        <option value="Gravel">Gravel</option>
        <option value="Loam">Loam</option>
        <option value="Millings">Millings</option>
        <option value="Mulch">Mulch</option>
      </select>
    </div>
    <div>
      <label>Yards</label>
      <select name="yards" id="yardsSelect">
        <option value="1">1 YD</option>
        <option value="2">2 YD</option>
        <option value="3">3 YD</option>
        <option value="4">4 YD</option>
        <option value="5">5 YD</option>
        <option value="6">6 YD</option>
        <option value="7">7 YD</option>
        <option value="8">8 YD</option>
        <option value="9">9 YD</option>
        <option value="10">10 YD</option>
      </select>
    </div>
  </div>

  <div class="row" id="deliveryPriceRow" style="display:none;">
    <div>
      <label>Price</label>
      <input name="priceDelivery" id="priceInputDelivery" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div id="tripNotice" class="trip-notice" style="display:none;"></div>

  <div class="row">
    <div>
      <label id="dropLabel">Drop-off Date</label>
      <input name="dropDate" type="date" />
    </div>
    <div id="pickupWrap">
      <label>Pickup Date</label>
      <input name="pickupDate" type="date" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Notes</label>
      <textarea name="notes" placeholder="Gate code, driveway access, permit #, etc."></textarea>
    </div>
  </div>

  <button type="submit" class="submit-btn">Log Job &amp; Text Crew</button>
  <div id="status"></div>
</form>

<h2>Recent Jobs</h2>
<div id="jobList">Loading…</div>

<script>
let currentType = 'rental';

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    const isDelivery = currentType === 'delivery';
    document.getElementById('rentalRow').style.display = isDelivery ? 'none' : 'flex';
    document.getElementById('deliveryRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('deliveryPriceRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('dropLabel').textContent = isDelivery ? 'Delivery Date' : 'Drop-off Date';
    document.getElementById('pickupWrap').style.display = isDelivery ? 'none' : 'block';
    updateTripNotice();
  });
});

      <input name="customer" required placeholder="Name" />
    </div>
    <div style="position: relative;">
      <label>Address</label>
      <input name="address" id="addressInput" required placeholder="Start typing an address…" autocomplete="off" />
      <div id="addressSuggestions" class="address-suggestions"></div>
    </div>
  </div>

  <div class="row" id="rentalRow">
    <div>
      <label>Dumpster Size</label>
      <select name="size" id="sizeSelect">
        <option value="10 YD">10 YD</option>
        <option value="15 YD">15 YD</option>
      </select>
    </div>
    <div>
      <label>Price</label>
      <input name="price" id="priceInputRental" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div class="row" id="deliveryRow" style="display:none;">
    <div>
      <label>Material</label>
      <select name="material" id="materialSelect">
        <option value="Gravel">Gravel</option>
        <option value="Loam">Loam</option>
        <option value="Millings">Millings</option>
        <option value="Mulch">Mulch</option>
      </select>
    </div>
    <div>
      <label>Yards</label>
      <select name="yards" id="yardsSelect">
        <option value="1">1 YD</option>
        <option value="2">2 YD</option>
        <option value="3">3 YD</option>
        <option value="4">4 YD</option>
        <option value="5">5 YD</option>
        <option value="6">6 YD</option>
        <option value="7">7 YD</option>
        <option value="8">8 YD</option>
        <option value="9">9 YD</option>
        <option value="10">10 YD</option>
      </select>
    </div>
  </div>

  <div class="row" id="deliveryPriceRow" style="display:none;">
    <div>
      <label>Price</label>
      <input name="priceDelivery" id="priceInputDelivery" type="number" step="0.01" placeholder="e.g. 425" />
    </div>
  </div>

  <div id="tripNotice" class="trip-notice" style="display:none;"></div>

  <div class="row">
    <div>
      <label id="dropLabel">Drop-off Date</label>
      <input name="dropDate" type="date" />
    </div>
    <div id="pickupWrap">
      <label>Pickup Date</label>
      <input name="pickupDate" type="date" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Notes</label>
      <textarea name="notes" placeholder="Gate code, driveway access, permit #, etc."></textarea>
    </div>
  </div>

  <button type="submit" class="submit-btn">Log Job &amp; Text Crew</button>
  <div id="status"></div>
</form>

<h2>Recent Jobs</h2>
<div id="jobList">Loading…</div>

<script>
let currentType = 'rental';

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    const isDelivery = currentType === 'delivery';
    document.getElementById('rentalRow').style.display = isDelivery ? 'none' : 'flex';
    document.getElementById('deliveryRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('deliveryPriceRow').style.display = isDelivery ? 'flex' : 'none';
    document.getElementById('dropLabel').textContent = isDelivery ? 'Delivery Date' : 'Drop-off Date';
    document.getElementById('pickupWrap').style.display = isDelivery ? 'none' : 'block';
    updateTripNotice();
  });
});

const yardsSelect = document.getElementById('yardsSelect');
const tripNotice = document.getElementById('tripNotice');

function updateTripNotice() {
  if (currentType !== 'delivery') {
    tripNotice.style.display = 'none';
    return;
  }
  const yards = parseInt(yardsSelect.value, 10);
  if (yards > 5) {
    const trips = Math.ceil(yards / 5);
    tripNotice.textContent = `Truck holds 5 YD max — this will be logged and texted as ${trips} separate trips.`;
    tripNotice.style.display = 'block';
  } else {
    tripNotice.style.display = 'none';
  }
}
yardsSelect.addEventListener('change', updateTripNotice);

const form = document.getElementById('jobForm');
const statusEl = document.getElementById('status');

// ---- address autocomplete (OpenStreetMap Nominatim, no API key needed) ----
const addressInput = document.getElementById('addressInput');
const suggestBox = document.getElementById('addressSuggestions');
let addressDebounce;

addressInput.addEventListener('input', () => {
  clearTimeout(addressDebounce);
  const q = addressInput.value.trim();
  if (q.length < 4) {
    suggestBox.style.display = 'none';
    suggestBox.innerHTML = '';
    return;
  }
  addressDebounce = setTimeout(() => searchAddress(q), 400);
});

async function searchAddress(q) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const results = await res.json();
    if (!results.length) {
      suggestBox.style.display = 'none';
      suggestBox.innerHTML = '';
      return;
    }
    suggestBox.innerHTML = results.map(r =>
      `<div data-address="${escapeHtml(r.display_name)}">${escapeHtml(r.display_name)}</div>`
    ).join('');
    suggestBox.style.display = 'block';
  } catch (e) {
    suggestBox.style.display = 'none';
  }
}

suggestBox.addEventListener('click', (e) => {
  const target = e.target.closest('div[data-address]');
  if (!target) return;
  addressInput.value = target.dataset.address;
  suggestBox.style.display = 'none';
  suggestBox.innerHTML = '';
});

document.addEventListener('click', (e) => {
  if (e.target !== addressInput && !suggestBox.contains(e.target)) {
    suggestBox.style.display = 'none';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';
  statusEl.className = '';
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  body.type = currentType;
  body.price = currentType === 'delivery' ? body.priceDelivery : body.price;

  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save job');

    const trips = data.trips || [];
    const allSent = trips.length > 0 && trips.every(t => t.textResult && t.textResult.sent);
    if (allSent) {
      statusEl.textContent = trips.length > 1
        ? `✅ Logged and texted the crew — ${trips.length} trips.`
        : '✅ Logged and notified the crew.';
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = '⚠️ Job logged, but nothing sent — check Twilio/email setup.';
      statusEl.className = 'err';
    }
    form.reset();
    document.querySelector('.type-toggle button[data-type="rental"]').click();
    loadJobs();
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    statusEl.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log Job & Text Crew';
  }
});

async function loadJobs() {
  const listEl = document.getElementById('jobList');
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    if (jobs.length === 0) {
      listEl.innerHTML = '<p style="color:#999">No jobs logged yet.</p>';
      return;
    }
    listEl.innerHTML = jobs.slice(0, 25).map(j => `
      <div class="job">
        <div class="job-top">
          <div class="job-title">${escapeHtml(j.customer)}</div>
          <div class="job-badge">${j.type === 'delivery' ? 'Delivery' : 'Rental'}${j.tripLabel ? ' · ' + escapeHtml(j.tripLabel) : ''}</div>
        </div>
        <div class="job-meta">
          ${escapeHtml(j.address)}<br/>
          ${j.type === 'delivery'
            ? `${j.material ? escapeHtml(j.material) + ' · ' : ''}${j.yards ? j.yards + ' YD · ' : ''}`
            : `${j.size ? escapeHtml(j.size) + ' · ' : ''}`
          }${j.dropDate || ''}${j.pickupDate ? ' → ' + j.pickupDate : ''}${j.price ? ' · $' + j.price : ''}
        </div>
        <div class="job-sent ${j.textResult?.sent ? 'ok' : 'err'}">
          ${j.textResult?.sent ? '✓ Texted crew' : '✗ Text not sent'}
        </div>
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = '<p style="color:#c62828">Could not load jobs.</p>';
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadJobs();
</script>

</div>
</body>
</html>
